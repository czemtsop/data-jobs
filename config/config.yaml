# Canadian Analyst Job Market — pipeline configuration

source:
  # Drop the monthly Job Bank open-data CSVs (English files) here.
  # https://open.canada.ca/data/en/dataset/ea639e28-c0fc-48bf-b5dd-b8899bd43072
  raw_dir: data/job-bank
  file_glob: "*.csv"

output:
  model_dir: data/model          # star-schema CSVs that Power BI loads
  findings_file: data/model/findings.json

# A posting is "in scope" when its title matches an include pattern and
# no exclude pattern. Patterns are case-insensitive regular expressions.
filters:
  title_include:
    - '\banalyst'
    - '\banalytics\b'
    - '\banalyste'                # French titles posted in the English file
  title_exclude:
    - 'psychoanalyst'
    - 'behaviou?r analyst'         # clinical ABA roles, not business analysis
    - 'analyste? du comportement'

# Role families, checked in order; first match wins. Anything else = "Other analyst".
role_families:
  - name: Data & BI
    patterns: ['\bdata\b', '\bbi\b', 'business intelligence', 'reporting', 'analytics', 'insights?\b', 'database', '\bsql\b', 'données', 'statistic', 'artificial intelligence', '\bgis\b']
  - name: Financial
    patterns: ['financ', 'fp&a', 'investment', 'cr[eé]dit', '\brisk\b', 'budget', 'pricing', 'treasury', 'cost\b', 'actuar', 'accounting', 'comptab', '\btax\b', 'fiscal', 'accounts (?:payable|receivable)', 'audit', 'compliance', 'capital markets', 'banking', 'quantitative', 'payroll', 'accountant', 'lending', 'loans?\b', 'fixed income', 'asset management', 'real estate', 'insurance']
  - name: Business & Systems
    patterns: ['business', 'systems? analyst', 'management analyst', 'process', 'functional', 'fonctionnel', '\berp\b', '\bsap\b', 'affaires', 'integration', 'programmer', 'programmeu', 'applications? analyst', 'computer', 'd[eé]velopp', 'information systems']
  - name: IT Support & Security
    patterns: ['support', 'help ?desk', 'service desk', 'cyber', 'security', 's[eé]curit', 'network', 'r[eé]seau', 'technical', 'information technology', '\bit\b', 'informatique', 'infrastructure']
  - name: Marketing & Sales
    patterns: ['marketing', 'sales', 'market research', 'market intelligence', 'social media', 'digital', 'e-?commerce', 'customer']
  - name: Policy & Research
    patterns: ['policy', 'politique', 'research', 'recherche', 'econom', 'intelligence', 'program analyst', 'regulatory']
  - name: Operations & Supply Chain
    patterns: ['supply', 'logistic', 'inventory', 'operations?\b', 'procurement', 'demand', 'planning', 'purchas', 'energy']
  - name: Lab & Quality
    patterns: ['laborator', '\blab\b', 'chemi', 'quality', '\bqc\b', '\bqa\b', 'assay']

seniority:                       # checked in order; default = Mid
  - name: Manager
    patterns: ['\bmanager\b', '\bdirector\b', '\bhead of\b', 'gestionnaire', 'directeur']
  - name: Senior
    patterns: ['\bsenior\b', '\bsr\.?\b', '\blead\b', 'principal', '\bstaff\b']   # "principal" also catches French "analyste principal"
  - name: Junior
    patterns: ['\bjunior\b', '\bjr\.?\b', '\bentry\b', '\bassociate\b', '\bintern\b', 'co-?op', '\bstagiaire\b', '\bstudent\b', '\bsummer\b', '\binternship\b']

salary:
  default_hours_per_week: 37.5   # used when an hourly posting has no hours
  weeks_per_year: 52
  annual_floor: 25000            # annualized values outside this range are treated as unusable
  annual_ceiling: 400000

findings:
  min_group_size: 30             # a province / family needs this many salaried postings to be ranked
