[project]
name = "data-jobs"
version = "0.2.0"
description = "Canadian analyst job market: Job Bank open data -> Power BI star schema"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.3",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
